<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">TCP LARP namespace testbed</title>
  <desc id="desc">Two senders with fq pacing share a TBF-shaped forward bottleneck and a delay router before reaching the receiver. Netem adds delay in both directions; reverse ACKs bypass the forward shaper.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3153ad"/></marker><marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#46695b"/></marker></defs>
  <rect width="1120" height="540" rx="8" fill="#f5f2eb"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="40" y="52" font-size="15" letter-spacing="2">THE LAB / FIVE NETWORK NAMESPACES</text>
    <text x="40" y="96" font-size="30" font-weight="700">Two senders. One shared bottleneck.</text>
    <g stroke="#3153ad" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M255 207H290V275H335"/><path d="M255 357H290V290H335"/>
      <path d="M540 282H630"/><path d="M820 282H900"/>
    </g>
    <g fill="#fff" stroke="#111" stroke-width="2">
      <rect x="40" y="150" width="215" height="115"/><rect x="40" y="300" width="215" height="115"/>
      <rect x="335" y="220" width="205" height="125" fill="#e3e9f7"/>
      <rect x="630" y="220" width="190" height="125"/>
      <rect x="900" y="220" width="180" height="125"/>
    </g>
    <g font-size="23" font-weight="700">
      <text x="60" y="188">Sender A</text><text x="60" y="338">Sender B</text>
      <text x="355" y="258">Bottleneck</text><text x="650" y="258">Delay router</text><text x="920" y="258">Receiver</text>
    </g>
    <g font-size="18">
      <text x="60" y="220">fq pacing</text><text x="60" y="246">namespace c</text>
      <text x="60" y="370">fq pacing</text><text x="60" y="396">namespace c2</text>
      <text x="355" y="290">TBF + FIFO / RED</text><text x="355" y="321">namespace r</text>
      <text x="650" y="290">netem: RTT / 2</text><text x="650" y="321">namespace d</text>
      <text x="920" y="290">netem: RTT / 2</text><text x="920" y="321">namespace s</text>
    </g>
    <text x="558" y="248" font-size="17" fill="#3153ad">Data →</text>
    <path d="M990 359V435H439V359" stroke="#46695b" stroke-width="3" fill="none" marker-end="url(#ack)"/>
    <text x="524" y="422" font-size="19" fill="#46695b">← ACKs: reverse path, no forward TBF</text>
    <text x="40" y="498" font-size="19">Diskless ARM64 guest · Linux 6.12.115 · 2 vCPUs · 4 GiB RAM</text>
  </g>
</svg>
