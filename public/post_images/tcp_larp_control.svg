<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">TCP LARP control loop</title>
  <desc id="desc">Launch uses a one gigabit per second guess and a 512 segment initial cap. ACK feedback qualifies learning. Congestion events request relaxation before timed probing is considered. The output controls pacing and an ACK and recovery constrained flight target.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#111"/></marker></defs>
  <rect width="1120" height="690" rx="8" fill="#f5f2eb"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="40" y="48" font-size="15" letter-spacing="2">THE CONTROLLER / FEEDBACK BEFORE GROWTH</text>
    <text x="40" y="92" font-size="32" font-weight="700">Guess → measure → adapt</text>
    <g stroke="#111" stroke-width="2" fill="#fff">
      <rect x="40" y="127" width="1040" height="100"/>
      <rect x="40" y="277" width="490" height="158" fill="#f0e0d0"/>
      <rect x="590" y="277" width="490" height="158" fill="#e3e9f7"/>
      <rect x="40" y="499" width="1040" height="138"/>
    </g>
    <text x="65" y="163" font-size="24" font-weight="700">01 / LAUNCH</text>
    <text x="65" y="195" font-size="20">1 Gbps initial guess · up to 512 segments until qualified delivery feedback</text>
    <path d="M285 227V269" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
    <path d="M835 227V269" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
    <text x="65" y="313" font-size="24" font-weight="700">02 / RELAX</text>
    <text x="65" y="346" font-size="20">New queue growth, ECN, or loss</text>
    <text x="65" y="379" font-size="20">Delay: delivery-aware reduction</text>
    <text x="65" y="410" font-size="20">ECN / loss: 30% rate reduction*</text>
    <text x="615" y="313" font-size="24" font-weight="700">03 / PROBE</text>
    <text x="615" y="346" font-size="20">No congestion event; timer eligible</text>
    <text x="615" y="379" font-size="20">Low delay: 25% growth candidate</text>
    <text x="615" y="410" font-size="20">Elevated delay: 5% candidate</text>
    <path d="M285 435V489" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
    <path d="M835 435V489" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
    <text x="65" y="537" font-size="24" font-weight="700">APPLY / PACING + FLIGHT TARGET</text>
    <text x="65" y="572" font-size="20">Qualified learning releases the initial flight cap; delivery gates rate extensions.</text>
    <text x="65" y="608" font-size="20">ACK growth, recovery, receiver window, and socket limits still apply.</text>
    <text x="40" y="670" font-size="16">*Subject to the rate floor and cut timer. This schematic summarizes the equations in the writeup.</text>
  </g>
</svg>
